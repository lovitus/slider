version: 2

project_name: slider

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: slider-archives
    main: .
    binary: slider
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - windows_386
      - windows_amd64_v1
      - windows_arm64
      - linux_386
      - linux_amd64_v1
      - linux_arm64
      - linux_arm_6
      - linux_arm_7
      - linux_mips_softfloat
      - linux_mipsle_softfloat
      - linux_mips64
      - linux_mips64le
      - darwin_amd64_v1
      - darwin_arm64
      - freebsd_386
      - freebsd_amd64_v1

  - id: slider-linux-packages
    main: .
    binary: slider
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - linux_amd64_v1
      - linux_arm64

archives:
  - id: slider
    ids:
      - slider-archives
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: false
    files:
      - LICENSE
      - README.md
      - RELEASE.md
      - config/**/*
      - systemd/*

nfpms:
  - id: slider-linux
    package_name: slider
    file_name_template: "{{ .ConventionalFileName }}"
    ids:
      - slider-linux-packages
    vendor: Slider
    homepage: https://github.com/lovitus/slider
    maintainer: Slider Maintainers <noreply@github.com>
    description: A forward proxy with multiple protocol support, DNS forwarding, and ipset management.
    license: GPL-3.0-only
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    release: "1"
    contents:
      - src: systemd/slider@.service
        dst: /lib/systemd/system/slider@.service

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "dev-{{ .ShortCommit }}"

release:
  prerelease: auto
  draft: false
  replace_existing_artifacts: true
