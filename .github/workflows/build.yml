name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test packages
        run: go test -vet=off ./...

      - name: Build binary
        run: go build -v .

      - name: Check version command
        run: |
          set -euo pipefail
          ./slider --version | grep -q "slider dev"
          ./slider -version | grep -q "slider dev"
